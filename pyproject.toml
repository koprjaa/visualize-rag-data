[project]
name = "chromadb-embedding-visualizer"
version = "1.0.0"
description = "Render a ChromaDB vector store as a 3D point cloud. UMAP and HDBSCAN in Python, Three.js in the browser."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jan Alexandr Kopřiva", email = "jan.alexandr.kopriva@gmail.com" }]
keywords = ["chromadb", "embeddings", "umap", "hdbscan", "visualization", "threejs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.26", "scikit-learn>=1.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/koprjaa/chromadb-embedding-visualizer"
Repository = "https://github.com/koprjaa/chromadb-embedding-visualizer"
Issues = "https://github.com/koprjaa/chromadb-embedding-visualizer/issues"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "PTH", "TRY", "PERF", "RUF"]
# E501  line length is handled by the formatter, not worth failing CI over
# TRY003 wants one exception subclass per message. That is ceremony for a
#        message a reader needs, so informative raises stay.
ignore = ["E501", "TRY003"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
pythonpath = ["backend"]
addopts = "-q --strict-markers"

[tool.uv]
package = false
